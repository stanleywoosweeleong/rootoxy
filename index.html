<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="RootOxy">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>RootOxy 根区补氧</title>
<meta name="theme-color" content="#0E6B74">
<style>
/* Layout: one narrow reading column, sticky header, icon nav fixed at the bottom; soil-and-oxygen palette */
:root{
  --bg:#EFF2EC; --surface:#FFFFFF; --sunk:#E3E8E0;
  --ink:#16201C; --ink2:#2F3B36; --line:#BCC6BC;
  --clay:#7A4E31; --clay-soft:#EADFD3;
  --oxy:#0E6B74; --oxy-soft:#D3ECEE; --on-oxy:#FFFFFF;
  --ctl:#7D776A;
  --sig:#1F6F2A; --sig-bg:#DCEFD9;
  --weak:#8A4E00; --weak-bg:#FBE8C8;
  --ns:#3F4A45; --ns-bg:#E2E6E1;
  --warn-bg:#FFF0D6; --warn-line:#C98A1E;
  /* system faces only, so offline and online look the same */
  --display:-apple-system,"Segoe UI Variable Display","Segoe UI",Roboto,"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --body:-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei","Noto Sans SC","Noto Sans CJK SC",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  --fs:17px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1517; --surface:#182124; --sunk:#202B2E;
  --ink:#ECF1EE; --ink2:#CFD8D3; --line:#34423F;
  --clay:#D49B74; --clay-soft:#2E241D;
  --oxy:#5CC8D0; --oxy-soft:#123A3E; --on-oxy:#06262A;
  --ctl:#A9A291;
  --sig:#7FD487; --sig-bg:#173A1C;
  --weak:#F2B35A; --weak-bg:#3A2A10;
  --ns:#C2CCC7; --ns-bg:#283330;
  --warn-bg:#33270F; --warn-line:#C98A1E;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1517; --surface:#182124; --sunk:#202B2E;
  --ink:#ECF1EE; --ink2:#CFD8D3; --line:#34423F;
  --clay:#D49B74; --clay-soft:#2E241D;
  --oxy:#5CC8D0; --oxy-soft:#123A3E; --on-oxy:#06262A;
  --ctl:#A9A291;
  --sig:#7FD487; --sig-bg:#173A1C;
  --weak:#F2B35A; --weak-bg:#3A2A10;
  --ns:#C2CCC7; --ns-bg:#283330;
  --warn-bg:#33270F; --warn-line:#C98A1E;
  color-scheme:dark}

html{font-size:var(--fs)}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:500;font-size:1rem;line-height:1.55;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.2;color:var(--ink)}
h1{font-size:1.65rem;font-weight:700}
h2{font-size:1.3rem;font-weight:700}
h3{font-size:1.08rem;font-weight:700}
p{margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--oxy);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0;background:none;border:0;padding:4px 0;cursor:pointer;text-align:left;border-radius:6px}
.totop{position:fixed;right:16px;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:7;width:56px;height:56px;border-radius:50%;border:2px solid var(--on-oxy);background:var(--oxy);color:var(--on-oxy);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.28)}
.totop svg{width:28px;height:28px}
.brand svg{flex:none}
.brand b{font-family:var(--display);font-size:1.3rem;font-weight:700;white-space:nowrap}
.hbtn{min-width:48px;height:44px;padding:0 10px;border:2px solid var(--ink);background:var(--surface);border-radius:6px;font-weight:700;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center}
.hbtn svg{width:24px;height:24px}
input[type=text],input[type=date]{min-height:48px;padding:8px 12px;font:inherit;font-weight:600;border:2px solid var(--ink2);border-radius:6px;background:var(--bg);color:var(--ink);width:100%;max-width:100%}
.logrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.logrow .meta{font-family:var(--mono);font-size:.95rem}
.del{min-height:40px;padding:0 12px;border:2px solid var(--line);background:var(--surface);border-radius:6px;font-weight:700;cursor:pointer}
.btn2{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:10px 16px;border-radius:6px;border:2px solid var(--ink);background:var(--surface);color:var(--ink);font-weight:700;cursor:pointer}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.toast{font-weight:700;color:var(--sig)}

main{max-width:760px;margin:0 auto;padding:18px 16px calc(110px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:22px}
section{display:flex;flex-direction:column;gap:12px}
.eyebrow{font-family:var(--mono);font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;color:var(--clay);font-weight:600}
.lead{font-size:1.06rem;color:var(--ink2)}

/* verdict */
.verdict{background:var(--oxy-soft);border:2px solid var(--oxy);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:10px}
.verdict h2{color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:6px;border:2px solid var(--oxy);background:var(--oxy);color:var(--on-oxy);font-weight:700;cursor:pointer;align-self:flex-start}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:600px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .big{font-family:var(--mono);font-size:1.6rem;font-weight:600;line-height:1.1}
.upd{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--sig-bg);color:var(--sig);border:2px solid var(--sig);border-radius:8px;padding:12px 14px;font-weight:700;display:flex;align-items:center;gap:10px;max-width:728px;margin:0 auto;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.upd button{margin-left:auto;min-height:40px;padding:0 12px;border:2px solid var(--sig);background:var(--surface);color:var(--sig);border-radius:6px;font-weight:700;cursor:pointer}
.plan-det{border:2px solid var(--oxy)}
.plan-det>summary{color:var(--oxy)}
.aid-det{border:2px solid var(--warn-line);background:var(--warn-bg)}
.bigtag{font-family:var(--display);font-size:1.45rem;font-weight:700;text-align:center;padding:12px 16px;border-radius:0 0 8px 8px;font-variant-numeric:tabular-nums}
.tilebtn{text-align:left;cursor:pointer;align-items:flex-start;color:var(--ink)}
.tilebtn[aria-pressed="true"]{border:2px solid var(--oxy);background:var(--oxy-soft)}
.tile .lbl{font-weight:600}

/* badge */
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.85rem;font-weight:700;white-space:nowrap}
.b-s{background:var(--sig-bg);color:var(--sig)}
.b-w{background:var(--weak-bg);color:var(--weak)}
.b-n{background:var(--ns-bg);color:var(--ns)}

/* facts */
.facts{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr);gap:8px 14px;margin:0}
.facts dt{font-weight:700;color:var(--clay)}
.facts dd{margin:0;min-width:0}
@media (max-width:420px){.facts{grid-template-columns:minmax(0,1fr)}.facts dd{margin-bottom:6px}}

details{background:var(--surface);border:1px solid var(--line);border-radius:8px}
summary{cursor:pointer;padding:14px 16px;font-family:var(--display);font-weight:700;font-size:1.08rem;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-family:var(--mono);font-size:1.3rem;line-height:1}
details[open] summary::after{content:"−"}
.det-body{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}

ol.steps,ul.plain{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
ol.steps{counter-reset:s}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:2rem minmax(0,1fr);gap:10px;align-items:start}
ol.steps li>:not(:first-child){grid-column:2}
ol.steps li::before{content:counter(s);font-family:var(--mono);font-weight:600;width:2rem;height:2rem;border-radius:50%;background:var(--clay-soft);color:var(--clay);display:flex;align-items:center;justify-content:center}
ul.plain li{padding-left:1.1rem;position:relative}
ul.plain li::before{content:"";position:absolute;left:0;top:.62em;width:7px;height:7px;background:var(--clay);border-radius:1px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px}
.cite{font-size:.92rem;color:var(--ink2);border-top:1px solid var(--line);padding-top:12px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:46px;padding:8px 14px;border:2px solid var(--line);background:var(--surface);border-radius:6px;font-weight:700;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--oxy);background:var(--oxy);color:var(--on-oxy)}

/* legend + metric bars */
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-weight:600}
.key{display:inline-flex;align-items:center;gap:6px}
.sw{width:18px;height:12px;border-radius:2px;display:inline-block}
.sw.c{background:var(--ctl)} .sw.t{background:var(--oxy)}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:8px}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.mname{font-weight:700;min-width:0}
.unit{color:var(--ink2);font-weight:500;font-size:.92rem}
.row{display:grid;grid-template-columns:5.2rem minmax(0,1fr);gap:10px;align-items:center}
.row .who{font-weight:600;font-size:.92rem}
.track{position:relative;height:30px;background:var(--sunk);border-radius:4px;overflow:hidden}
.fill{height:100%;border-radius:4px}
.fill.c{background:var(--ctl)} .fill.t{background:var(--oxy)}
.val{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-weight:600;font-size:.92rem;color:var(--ink);background:var(--surface);padding:0 5px;border-radius:3px;white-space:nowrap}
.delta{font-family:var(--mono);font-weight:600}
.takeaway{background:var(--clay-soft);border-radius:8px;padding:12px 14px;font-weight:600}

/* why */
.eq{font-family:var(--mono);font-size:1.25rem;font-weight:600;background:var(--sunk);border-radius:6px;padding:12px;text-align:center;overflow-x:auto;white-space:nowrap}
.range{width:100%;accent-color:var(--oxy);height:34px}
.out{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.out .tile .big{color:var(--oxy)}

/* settings box */
.settings{background:var(--surface);border:2px solid var(--clay);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:14px}
.settings h3{color:var(--clay)}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .flabel{font-weight:700}
.seg{display:flex;flex-wrap:wrap;gap:8px}
input[type=number]{width:8rem;min-height:48px;padding:8px 12px;font:inherit;font-family:var(--mono);font-weight:600;font-size:1.1rem;border:2px solid var(--ink2);border-radius:6px;background:var(--bg);color:var(--ink);-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.note{font-size:.95rem;color:var(--ink2)}
.warn{background:var(--warn-bg);border-left:5px solid var(--warn-line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:8px}

/* checklist */
.check{display:flex;flex-direction:column;gap:8px}
.check label{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px;cursor:pointer}
.check input{width:24px;height:24px;margin:2px 0 0;accent-color:var(--oxy)}
.check input:checked + span{text-decoration:line-through;color:var(--ink2)}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.tab{background:none;border:0;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--ink2);font-weight:600;font-size:.88rem;border-top:4px solid transparent}
.tab[aria-current="page"]{color:var(--oxy);border-top-color:var(--oxy)}
.tab svg{width:26px;height:26px}

/* language picker */
.picker{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px 16px}
.picker-in{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px;text-align:center}
.picker .langbtn{min-height:60px;border:2px solid var(--ink);background:var(--surface);border-radius:8px;font-size:1.25rem;font-weight:700;cursor:pointer}
.soil-art{width:100%;height:auto;max-width:100%;border-radius:8px;display:block}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@keyframes rise{from{transform:translateY(0);opacity:.95}to{transform:translateY(-36px);opacity:0}}
.bub{animation:rise 3.2s ease-in infinite}
</style>

</head>
<body>
<header class="top">
  <div class="top-in">
    <button class="brand" id="homeBtn" aria-label="Home">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect x="1" y="1" width="32" height="32" rx="7" fill="var(--clay)"/><path d="M17 6v22M17 17l-6 7M17 21l6 6" stroke="var(--clay-soft)" stroke-width="2.4" stroke-linecap="round" fill="none"/><circle cx="25" cy="10" r="3.2" fill="var(--oxy-soft)"/><circle cx="9" cy="12" r="2.2" fill="var(--oxy-soft)"/></svg>
      <b id="appTitle">根区补氧</b>
    </button>
    <button class="hbtn" id="themeBtn" aria-label="Theme"></button>
    <button class="hbtn" id="fsBtn" aria-label="Text size">Aa</button>
    <button class="hbtn" id="langBtn">中文</button>
  </div>
</header>

<main id="main"></main>

<button class="totop" id="topBtn" aria-label="Back to top" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V6M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>

<div class="upd" id="upd" hidden role="status"><span id="updTxt"></span><button id="updClose" aria-label="Close">✕</button></div>

<nav class="tabs" aria-label="Sections">
  <div class="tabs-in" id="tabs"></div>
</nav>

<div class="picker" id="picker" hidden>
  <div class="picker-in">
    <svg width="64" height="64" viewBox="0 0 34 34" aria-hidden="true" style="margin:0 auto"><rect x="1" y="1" width="32" height="32" rx="7" fill="var(--clay)"/><path d="M17 6v22M17 17l-6 7M17 21l6 6" stroke="var(--clay-soft)" stroke-width="2.4" stroke-linecap="round" fill="none"/><circle cx="25" cy="10" r="3.2" fill="var(--oxy-soft)"/><circle cx="9" cy="12" r="2.2" fill="var(--oxy-soft)"/></svg>
    <h2>选择语言 · Choose language · Pilih bahasa</h2>
    <button class="langbtn" data-pick="zh">中文</button>
    <button class="langbtn" data-pick="en">English</button>
    <button class="langbtn" data-pick="ms">Malay</button>
  </div>
</div>

<script>
(function(){
const APP_VER = "v1.5.0 · 2026-10-14";
const store = {
  get(k,d){try{const v=localStorage.getItem("rootoxy."+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem("rootoxy."+k,JSON.stringify(v))}catch(e){}}
};
const S = {
  lang: store.get("lang", null),
  tab: store.get("tab", "sum"),
  fs: store.get("fs", 17),
  grp: store.get("grp", "growth"),
  stock: store.get("stock", 50),
  trees: store.get("trees", 5),
  months: store.get("months", 4),
  r: 0.54,
  tile: 0,
  planOpen: store.get("planOpen", false),
  apps: store.get("apps", 2),
  water: store.get("water", 10),
  theme: store.get("theme", "auto"),
  checks: store.get("checks", {}),
  log: store.get("log", [])
};
const THEME_ICON={
  auto:'<circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/>',
  light:'<circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
  dark:'<path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>'
};
function applyTheme(){const r=document.documentElement;if(S.theme==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",S.theme);
  const b=document.getElementById("themeBtn");b.innerHTML=`<svg viewBox="0 0 24 24" aria-hidden="true">${THEME_ICON[S.theme]}</svg>`;
  b.setAttribute("aria-label",t(L({auto:"主题：跟随系统",light:"主题：浅色",dark:"主题：深色"}[S.theme],{auto:"Theme: system",light:"Theme: light",dark:"Theme: dark"}[S.theme],{auto:"Tema: sistem",light:"Tema: cerah",dark:"Tema: gelap"}[S.theme])))}
const L = (zh,en,ms)=>({zh,en,ms});
const t = o => (o && typeof o==="object") ? (o[S.lang||"zh"] ?? o.en) : o;
const fmt = (n,d=0)=>Number(n).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});

/* ---------- data from Gil et al. 2009, Tables 2–5 ---------- */
const BADGE = {
  s:   {cls:"b-s", txt:L("显著 · P≤0.05","Clear · P≤0.05","Ketara · P≤0.05")},
  w10: {cls:"b-w", txt:L("弱 · P≤0.1","Weak · P≤0.1","Lemah · P≤0.1")},
  w15: {cls:"b-w", txt:L("弱 · P≤0.15","Weak · P≤0.15","Lemah · P≤0.15")},
  n:   {cls:"b-n", txt:L("无差异","No difference","Tiada beza")}
};
const GROUPS = [
 {id:"growth", name:L("生长","Growth","Pertumbuhan"),
  take:L("地上部分（叶、枝干）明显长得更多；根没有变化。","Above-ground parts (leaves, wood) grew clearly more. Roots did not change.","Bahagian atas tanah (daun, kayu) tumbuh jelas lebih banyak. Akar tidak berubah."),
  m:[
   {n:L("整株干重","Whole tree dry weight","Berat kering seluruh pokok"),u:"g",c:2706.6,cs:"149.8",t:3181.9,ts:"147.1",p:"w10",d:1},
   {n:L("枝干干重（新梢＋老枝干）","Wood dry weight (new shoots + old wood)","Berat kering kayu (pucuk baru + kayu lama)"),u:"g",c:877.32,cs:"26",t:1111.50,ts:"24",p:"s",d:1},
   {n:L("叶片干重","Leaf dry weight","Berat kering daun"),u:"g",c:833.26,cs:"75",t:1067.48,ts:"13",p:"s",d:1},

function illoPots(){ // control vs H2O2 result; S.tile picks the emphasis
  const tile=TILES[S.tile]||TILES[0], m=getM(tile.g,tile.i), d=pct(m.c,m.t);
  const l=t(L(["不加双氧水","加双氧水","根：一样","每升水长出更多树","每棵用水一样多"],["Without H₂O₂","With H₂O₂","Roots: the same","More tree per litre of water","Same water per tree"],["Tanpa H₂O₂","Dengan H₂O₂","Akar: sama","Lebih pokok setiap liter air","Air sama setiap pokok"]));
  const k=tile.k;
  const dim='var(--line)';
  // every drawn size comes from the paper's own ratio, so the picture never says more than the number does:
  // an area or weight ratio R is drawn as a linear scale of sqrt(R) (area grows with the square of the radius)
  const ratio=(g,i)=>{const mm=getM(g,i);return mm.t/mm.c};
  const R={leaf:ratio("growth",4),leafw:ratio("growth",2),wood:ratio("growth",1),wue:ratio("growth",5),whole:ratio("growth",0),root:ratio("growth",3)};
  const lin=r=>Math.sqrt(r);
  const base={leafy:1,trunk:1,canopy:'var(--sig)',root:'var(--clay)',rootScale:1};
  const ctl={...base}, trt={...base};
  if(k==="leaf"||k==="leafw"){trt.leafy=lin(R[k]);ctl.root=trt.root=dim}
  if(k==="wood"){ctl.canopy=trt.canopy=dim;ctl.root=trt.root=dim;trt.trunk=R.wood}          // width is linear with cross-section weight at the same height: drawn as the ratio itself
  if(k==="whole"){trt.leafy=lin(R.whole);trt.trunk=lin(R.whole)}
  if(k==="root"){ctl.canopy=trt.canopy=dim;ctl.root=trt.root='var(--oxy)';trt.rootScale=lin(R.root)}
  if(k==="wue"){ctl.root=trt.root=dim;trt.leafy=lin(R.wue);trt.trunk=lin(R.wue)}
  const drops=(x)=>`<g transform="translate(${x},0)">${[-60,-20,20,60].map(dx=>`<path d="M${dx} 312q-11-14 0-28q11 14 0 28z" fill="var(--oxy)"/>`).join("")}</g>`;
  const pot=(x,lab,o)=>`<g transform="translate(${x},0)">
   <path d="M-90 170h180v110h-180z" fill="var(--clay-soft)"/>
   <path d="M-90 170h180M-90 170v110M90 170v110M-90 280h180" stroke="var(--line)" stroke-width="3" fill="none"/>
   ${Array.from({length:6},(_,i)=>`<line x1="${-90+i*36}" y1="170" x2="${-90+i*36}" y2="280" stroke="var(--line)" stroke-width="1" opacity=".6"/>`).join("")}
   ${tree(0,170,1.1,o.leafy,o.trunk,o.canopy)}
   ${roots(0,172,1.1*o.rootScale,o.root)}
   <text x="0" y="36" text-anchor="middle" font-size="32" fill="var(--ink)" style="${F}">${lab}</text>
  </g>`;
  const tagTxt=`${t(tile.lab)} ${sign(d)}%`;
  const tagCol=m.p==="n"?"var(--ns)":m.p==="s"?"var(--sig)":"var(--weak)";
  const tagBg=m.p==="n"?"var(--ns-bg)":m.p==="s"?"var(--sig-bg)":"var(--weak-bg)";
  const cap = t(k==="root"
    ? L("根的重量两组一样（差 1%，无差异）。","Root weight was the same in both groups (1% apart, no difference).","Berat akar sama dalam kedua-dua kumpulan (beza 1%, tiada beza).")
    : k==="wue" ? L("每棵用水一样多，但双氧水组每升水长出更多树。","Same water per tree, but the H₂O₂ trees grew more tree per litre of water.","Air sama setiap pokok, tetapi pokok H₂O₂ tumbuh lebih banyak bagi setiap liter air.")
    : L("地上部分变大，根的重量两组一样。","Above-ground parts grew; root weight stayed the same in both groups.","Bahagian atas tumbuh; berat akar kekal sama dalam kedua-dua kumpulan."));
  return `<svg viewBox="0 0 680 320" style="width:100%;height:auto;display:block" role="img" aria-label="${l[0]} / ${l[1]}: ${tagTxt}">
   <rect width="680" height="320" fill="var(--surface)" rx="8 8 0 0"/>
   ${pot(170,l[0],ctl)}${pot(510,l[1],trt)}
   ${k==="wue"?drops(170)+drops(510):""}
  </svg>
  <div class="bigtag" style="background:${tagBg};color:${tagCol}">${tagTxt}</div>
  <p class="takeaway" style="margin-top:8px">${cap} ${t(L("图中大小按论文数字等比画出。","Sizes in the drawing follow the paper's numbers.","Saiz dalam lukisan mengikut angka kertas."))}</p>`;
}

const DOSE_WORK=L("用量的两个数字互相矛盾。论文写浓度为「1 mg kg⁻¹（即 1 ppm）的 50% 双氧水」，又写整季每棵约 700 mL。用论文自己的用水效率反推，每棵整季只用了约 1,124 升水；700 mL 的 50% 双氧水（约 419 g）溶在这些水里，平均约 370 mg/L，若只在最后 10% 的灌溉时间注入，约 3,700 mg/L（0.37%），都远高于 1 ppm。论文没有说明哪个数字正确。","The two dose figures contradict each other. The paper gives the strength as \"1 mg kg⁻¹ (i.e. 1 ppm) of 50% H₂O₂\" and also says about 700 mL per tree for the season. Working back from the paper's own water use efficiency, each tree received only about 1,124 L of water all season. 700 mL of 50% H₂O₂ (about 419 g) in that water averages about 370 mg/L, or about 3,700 mg/L (0.37%) if injected only in the last 10% of each irrigation. Both are far above 1 ppm. The paper does not say which figure is right.","Dua angka dos bercanggah. Kertas menyatakan kekuatan \"1 mg kg⁻¹ (iaitu 1 ppm) H₂O₂ 50%\" dan juga kira-kira 700 mL setiap pokok untuk satu musim. Dikira semula daripada kecekapan guna air kertas itu sendiri, setiap pokok hanya menerima kira-kira 1,124 L air sepanjang musim. 700 mL H₂O₂ 50% (kira-kira 419 g) dalam air itu purata kira-kira 370 mg/L, atau kira-kira 3,700 mg/L (0.37%) jika disuntik hanya pada 10% terakhir setiap pengairan. Kedua-duanya jauh melebihi 1 ppm. Kertas tidak menyatakan angka mana yang betul.");

function metricCard(m){
  const mx=Math.max(Math.abs(m.c),Math.abs(m.t))||1;
  const w=v=>Math.max(4,Math.abs(v)/mx*100);
  const se=s=>s?` ± ${s}`:"";
  const d = m.c<0 ? `Δ ${sign(m.t-m.c,2)}` : `${sign(pct(m.c,m.t))}%`;
  return `<div class="metric">
   <div class="mhead"><div class="mname">${t(m.n)} ${m.u?`<span class="unit">(${m.u})</span>`:""}</div>${badge(m.p)}</div>
   <div class="row"><span class="who">${t(T.ctl)}</span><div class="track"><div class="fill c" style="width:${w(m.c)}%"></div><span class="val">${fmt(m.c,m.d)}${se(m.cs)}</span></div></div>
   <div class="row"><span class="who">${t(T.trt)}</span><div class="track"><div class="fill t" style="width:${w(m.t)}%"></div><span class="val">${fmt(m.t,m.d)}${se(m.ts)}</span></div></div>
   <div><span class="delta">${d}</span></div>
  </div>`;
}

function poise(){
  const r=S.r/100, per=(Math.pow(1+r,4)-1)*100;
  const vessels=63.6/59.8;

  return {per,tot,vesselsPct:(vessels-1)*100};
}

const DENS={30:1.11,35:1.13,50:1.196}; // g/mL at ~20 °C
const PAPER_G = 700*DENS[50]*0.5;      // paper: ~700 mL of 50% per tree over the ~4-month season
const PAPER_WEEKS = 4*4.345;           // Nov 2006 – Mar 2007
function calc(){
  if(!DENS[S.stock]) S.stock=50;
  const pc=S.stock, rho=DENS[pc];
  const weeks=Math.max(0.1,S.months*4.345);
  const trees=Math.max(0,Math.round(S.trees));
  const pureG=PAPER_G*weeks/PAPER_WEEKS;          // same weekly rate as the paper, scaled to the trial length
  const prodML=pureG/(pc/100*rho);
  const apps=Math.max(1,S.apps), water=Math.max(0.5,S.water);
  const perApp=prodML/weeks/apps;                  // mL of product per application
  const mgL=perApp*(pc/100)*rho*1000/water;        // strength of the diluted solution
  return {prodML, perWeek:prodML/weeks, perApp, mgL, apps, water, totL:prodML*trees/1000, pureG, o2:pureG/34.0147*0.5*31.998, trees};
}

   <ol class="steps">
    <li><span><b>${t(L("皮肤","Skin","Kulit"))}</b> — ${t(L("马上用大量清水冲 15 分钟，脱掉沾到的衣物。皮肤会发白、刺痛，通常一两个小时会退。起水泡或一直痛，去诊所。","Rinse at once with plenty of water for 15 minutes and take off any splashed clothing. The skin turns white and stings; this usually fades within an hour or two. If it blisters or keeps hurting, go to a clinic.","Bilas segera dengan banyak air selama 15 minit dan tanggalkan pakaian yang terkena. Kulit menjadi putih dan pedih; biasanya hilang dalam satu dua jam. Jika melepuh atau terus sakit, pergi ke klinik."))}</span></li>
    <li><span><b>${t(L("眼睛","Eyes","Mata"))}</b> — ${t(L("立刻用清水冲洗至少 15 分钟，撑开眼皮，有隐形眼镜要取出。冲完马上去医院，不要等。","Flush with clean water for at least 15 minutes, holding the eyelids open; take out contact lenses. Then go to a hospital straight away. Do not wait to see if it gets better.","Bilas dengan air bersih sekurang-kurangnya 15 minit sambil membuka kelopak mata; tanggalkan kanta lekap. Kemudian terus ke hospital. Jangan tunggu."))}</span></li>
    <li><span><b>${t(L("吸入","Breathed in","Terhidu"))}</b> — ${t(L("离开现场到空气流通处。咳嗽、胸闷、呼吸困难不退，去医院。不要在密闭房间里开浓双氧水。","Move to fresh air. If coughing, chest tightness or breathing trouble does not pass, go to a hospital. Never open concentrated H₂O₂ in a closed room.","Pergi ke udara segar. Jika batuk, sesak dada atau sukar bernafas tidak hilang, pergi ke hospital. Jangan buka H₂O₂ pekat di dalam bilik tertutup."))}</span></li>
    <li><span><b>${t(L("误吞","Swallowed","Tertelan"))}</b> — ${t(L("不要催吐。漱口，喝一杯水，马上去医院或打 999。浓双氧水在胃里会放出大量氧气，很危险。","Do not make the person vomit. Rinse the mouth, drink one glass of water, and go to a hospital or call 999 at once. Concentrated H₂O₂ releases a lot of gas in the stomach and is dangerous.","Jangan paksa muntah. Kumur mulut, minum segelas air, dan terus ke hospital atau hubungi 999. H₂O₂ pekat membebaskan banyak gas dalam perut dan berbahaya."))}</span></li>
   </ol>
  `;
}

function viewAid(){
  return `
  <section>
   <h1>${t(L("急救与安全","First aid & safety","Pertolongan cemas & keselamatan"))}</h1>
   ${aidBody()}
  </section>
  <section class="warn">
   <h2>${t(L("安全","Safety","Keselamatan"))}</h2>
   <ul class="plain">
    <li>${t(L("30–50% 双氧水是强氧化剂，会灼伤皮肤和眼睛。戴护目镜和耐化学手套。","30–50% hydrogen peroxide is a strong oxidiser that burns skin and eyes. Wear goggles and chemical-resistant gloves.","Hidrogen peroksida 30–50% ialah pengoksida kuat yang membakar kulit dan mata. Pakai cermin mata pelindung dan sarung tangan tahan kimia."))}</li>
    <li>${t(L("先放水，再把双氧水慢慢倒进大量的水里。","Put the water in first, then pour the peroxide slowly into plenty of water.","Masukkan air dahulu, kemudian tuang peroksida perlahan-lahan ke dalam banyak air."))}</li>
    <li>${t(L("不要和肥料、农药或其他化学品同桶混合；金属和有机物会令它快速分解。","Do not mix it in the same tank with fertiliser, pesticides or other chemicals. Metals and organic matter make it break down fast.","Jangan campur dalam tangki yang sama dengan baja, racun perosak atau bahan kimia lain. Logam dan bahan organik menyebabkannya terurai dengan cepat."))}</li>
    <li>${t(L("用原装塑料桶，放阴凉避光处，远离儿童；不要用金属容器，不要倒进饮料瓶。","Keep it in its original plastic container, cool, dark and away from children. Never use metal containers, and never pour it into a drink bottle.","Simpan dalam bekas plastik asal, di tempat sejuk, gelap dan jauh daripada kanak-kanak. Jangan guna bekas logam, dan jangan tuang ke dalam botol minuman."))}</li>
    <li>${t(L("远离易燃物：纸、布、木屑、燃油。浓双氧水沾到这些东西可能起火。洒出来用大量清水冲淡，不要用布或纸巾擦。","Keep it away from anything that burns: paper, cloth, sawdust, fuel. Concentrated H₂O₂ on these can start a fire. Flood a spill with plenty of water; do not wipe it with cloth or paper.","Jauhkan daripada benda yang mudah terbakar: kertas, kain, habuk kayu, minyak. H₂O₂ pekat pada benda ini boleh menyebabkan kebakaran. Siram tumpahan dengan banyak air; jangan lap dengan kain atau kertas."))}</li>
   </ul>
  </section>
  `;
}

function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function calcOut(c){
  const tl=(v,lab,cls="")=>`<div class="tile ${cls}"><span class="big">${v}</span><span class="lbl">${t(lab)}</span></div>`;
  const strength = c.mgL>=10000 ? `${fmt(c.mgL/10000,2)}%` : `${fmt(c.mgL)} mg/L`;
  return `<div class="tile" style="grid-column:1/-1;border:2px solid var(--oxy)"><span class="big" style="color:var(--oxy)">${fmt(c.perApp,1)} mL</span><span class="lbl">${t(L(`每棵每次：${S.stock}% 浓度的双氧水，先放 ${fmt(c.water,1)} 升水，再加入双氧水，淋在滴水线附近的根区`,`Per tree per application: ${S.stock}% hydrogen peroxide, add to ${fmt(c.water,1)} L of water (water first), then pour over the root zone near the drip line`,`Setiap pokok setiap kali: hidrogen peroksida ${S.stock}%, masukkan ke ${fmt(c.water,1)} L air (air dahulu), kemudian siram zon akar berhampiran garis titisan`))}</span><span class="note">${t(L("稀释后浓度","Diluted strength","Kekuatan selepas dicairkan"))}: <b class="num">${strength}</b>${c.mgL>=5000?` · ${t(L("偏浓，请加大用水量","strong; use more water","pekat; tambah air"))}`:""}</span></div>`
   + tl(`${fmt(c.prodML)} mL`,L(`每棵整季（${S.stock}% 浓度双氧水）`,`Per tree, whole trial (${S.stock}% H₂O₂)`,`Setiap pokok, sepanjang ujian (H₂O₂ ${S.stock}%)`))
   + tl(`${fmt(c.perWeek,1)} mL`,L("每棵每周","Per tree, per week","Setiap pokok, setiap minggu"))
   + tl(`${fmt(c.totL,2)} L`,L(`${c.trees} 棵树总量`,`Total for ${c.trees} trees`,`Jumlah untuk ${c.trees} pokok`))
   + tl(`${c.trees}`,L("留作对照、不处理的树","Control trees to leave untreated","Pokok kawalan yang tidak dirawat"))
   + tl(`${fmt(c.pureG)} g`,L("每棵纯双氧水","Pure H₂O₂ per tree","H₂O₂ tulen setiap pokok"))
   + tl(`≈${fmt(c.o2)} g`,L("每棵释放的氧气","Oxygen released per tree","Oksigen dibebaskan setiap pokok"));
}

/* ---------- render & events ---------- */
const VIEWS={sum:viewSum,res:viewRes,why:viewWhy,farm:viewFarm,aid:viewAid};
const LANGLBL={zh:"中文",en:"EN",ms:"BM"};
function render(){
  document.documentElement.lang = S.lang==="zh"?"zh-Hans":S.lang==="ms"?"ms":"en";
  document.documentElement.style.setProperty("--fs",S.fs+"px");
  document.getElementById("appTitle").textContent=t(T.title);
  document.getElementById("langBtn").textContent=LANGLBL[S.lang];
  document.getElementById("tabs").innerHTML=T.tabs.map(x=>`<button class="tab" data-tab="${x.id}" ${x.id===S.tab?'aria-current="page"':""}><svg viewBox="0 0 24 24" aria-hidden="true">${x.i}</svg>${t(x.n)}</button>`).join("");
  document.getElementById("main").innerHTML=(VIEWS[S.tab]||viewSum)();
}
function go(tab,anchor){S.tab=tab;store.set("tab",tab);render();
  const el=anchor&&document.getElementById(anchor);
  if(el){ if(el.tagName==="DETAILS") el.open=true; el.scrollIntoView({block:"start"}); } else window.scrollTo(0,0)}

document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.tab) go(b.dataset.tab);
  else if(b.dataset.go) go(b.dataset.go,b.dataset.anchor);
  else if(b.dataset.grp){S.grp=b.dataset.grp;store.set("grp",S.grp);render()}
  else if(b.dataset.stock){S.stock=+b.dataset.stock;store.set("stock",S.stock);render()}
  else if(b.dataset.tile!==undefined){S.tile=+b.dataset.tile;document.getElementById("potsIllo").innerHTML=illoPots();document.querySelectorAll("[data-tile]").forEach(x=>x.setAttribute("aria-pressed",String(+x.dataset.tile===S.tile)))}
  else if(b.id==="planReset"){Object.assign(S,{stock:50,trees:5,months:4,apps:2,water:10});["stock","trees","months","apps","water"].forEach(k=>store.set(k,S[k]));render()}
  else if(b.dataset.apps){S.apps=+b.dataset.apps;store.set("apps",S.apps);render()}
  else if(b.dataset.del!==undefined){S.log.splice(+b.dataset.del,1);store.set("log",S.log);render()}
  else if(b.id==="lgAdd"){
    const ml=parseFloat(document.getElementById("lgMl").value);
    const e={d:document.getElementById("lgDate").value||today(),pc:S.stock,tree:document.getElementById("lgTree").value.trim().slice(0,20),ml:isFinite(ml)?ml:0,rain:document.getElementById("lgRain").checked,note:document.getElementById("lgNote").value.trim().slice(0,60)};
    S.log.unshift(e);store.set("log",S.log);render();}
  else if(b.id==="lgCopy"){
    const txt=["date\ttree\tmL\tH2O2 %\train\tnote",...S.log.map(e=>[e.d,e.tree,e.ml,e.pc||"",e.rain?"yes":"no",e.note].join("\t"))].join("\n");
    const toast=document.getElementById("lgToast");
    const done=()=>{toast.textContent=t(L("已复制","Copied","Disalin"));setTimeout(()=>toast.textContent="",2000)};
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt,done)); else fallbackCopy(txt,done);}
  else if(b.id==="themeBtn"){const o=["auto","light","dark"];S.theme=o[(o.indexOf(S.theme)+1)%3];store.set("theme",S.theme);applyTheme()}
  else if(b.dataset.r){S.r=+b.dataset.r;render()}
  else if(b.dataset.pick){S.lang=b.dataset.pick;store.set("lang",S.lang);document.getElementById("picker").hidden=true;render()}
  else if(b.id==="homeBtn") go("sum");
  else if(b.id==="topBtn") window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
  else if(b.id==="langBtn"){const o=["zh","en","ms"];S.lang=o[(o.indexOf(S.lang)+1)%3];store.set("lang",S.lang);render()}
  else if(b.id==="fsBtn"){const o=[17,19,21];S.fs=o[(o.indexOf(S.fs)+1)%3]||17;store.set("fs",S.fs);render()}
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.id==="rr"){S.r=+el.value;const p=poise();
    document.getElementById("rrv").textContent="+"+fmt(S.r,2)+"%";
    document.getElementById("pPer").textContent=sign(p.per,1)+"%";
    document.getElementById("pTot").textContent=sign(p.tot,1)+"%";
    document.querySelectorAll("[data-r]").forEach(x=>x.setAttribute("aria-pressed",String(+x.dataset.r===S.r)));}
  if(el.id==="trees"||el.id==="months"||el.id==="water"){
    const v=parseFloat(el.value);if(!isFinite(v)||v<=0)return;
    S[el.id]=v;store.set(el.id,v);
    const cc=calc();document.getElementById("calcOut").innerHTML=calcOut(cc);document.getElementById("applyIllo").innerHTML=illoApply(cc);}
});
document.addEventListener("toggle",e=>{const el=e.target;if(el.id==="planner"){S.planOpen=el.open;store.set("planOpen",el.open)}},true);
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.ck!==undefined){S.checks[el.dataset.ck]=el.checked;store.set("checks",S.checks)}
});

function fallbackCopy(txt,done){const ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done()}catch(e){}document.body.removeChild(ta)}
function showUpdated(v){
  document.getElementById("updTxt").textContent=t(L(`软件已更新到 ${v}`,`App updated to ${v}`,`Aplikasi dikemas kini ke ${v}`));
  document.getElementById("upd").hidden=false;
  clearTimeout(showUpdated.tm);showUpdated.tm=setTimeout(()=>{document.getElementById("upd").hidden=true},8000);
}
document.getElementById("updClose").addEventListener("click",()=>{document.getElementById("upd").hidden=true});
/* version check: the service worker keeps index.html fresh; the page notices the version changed since last launch */
{const last=store.get("lastVer",null);if(last&&last!==APP_VER&&S.lang) setTimeout(()=>showUpdated(APP_VER),400);store.set("lastVer",APP_VER)}
if("serviceWorker" in navigator){navigator.serviceWorker.addEventListener("message",e=>{if(e.data&&e.data.type==="updated"&&e.data.version&&e.data.version!==APP_VER) showUpdated(e.data.version)})}
const topBtn=document.getElementById("topBtn");
function onScroll(){topBtn.hidden = window.scrollY < 400}
window.addEventListener("scroll",onScroll,{passive:true});
function setHomeLabel(){const h=t(L("返回主页","Back to home","Kembali ke utama")),u=t(L("回到顶部","Back to top","Kembali ke atas"));document.getElementById("homeBtn").setAttribute("aria-label",h);topBtn.setAttribute("aria-label",u)}
const _render=render;render=function(){_render();setHomeLabel();applyTheme();onScroll()};

if(!S.lang){S.lang="zh";document.getElementById("picker").hidden=false}
render();
})();
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js")}</script>
</body>
</html>
